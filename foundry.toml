[profile.default]
src = "src"
out = "out"
libs = ["lib"]
auto_detect_solc = false
solc_version = "0.8.37"
evm_version = "osaka"
optimizer = true
optimizer_runs = 200
fs_permissions = [{ access = "read-write", path = "./" }]
remappings = [
    "forge-std/=lib/forge-std/src/",
    "solady/=lib/solady/src/",
    "@openzeppelin/contracts/=lib/openzeppelin-contracts/contracts/",
    "@openzeppelin/contracts@5.3.0/=lib/openzeppelin-contracts/contracts/",
    "@chainlink/contracts-ccip/=lib/chainlink-ccip/chains/evm/contracts/",
    "@predicate/=lib/predicate-contracts/src/",
]
cbor_metadata = true
gas_limit = "18446744073709551615"        
disable_block_gas_limit = true

[rpc_endpoints]
eth = "${ETH_RPC}"
rh = "${RH_RPC}"
arb = "${ARB_RPC}"

[fmt]
single_line_statement_blocks = "preserve"
multiline_func_header = "all"
sort_imports = false
contract_new_lines = true
override_spacing = false
line_length = 120
tab_width = 4
style = "space"
bracket_spacing = true
int_types = "long"
prefer_compact = "all"
quote_style = "double"
number_underscore = "thousands"
hex_underscore = "remove"
wrap_comments = true
docs_style = "preserve"
ignore = []
pow_no_space = false
single_line_imports = false
namespace_import_style = "prefer_plain"
