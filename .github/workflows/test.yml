name: CI

permissions: {}

on:
  push:
  pull_request:
  workflow_dispatch:

jobs:
  check:
    name: Foundry project
    runs-on: ubuntu-latest
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@9c091bb21b7c1c1d1991bb908d89e4e9dddfe3e0 # v7.0.0
        with:
          persist-credentials: false
          submodules: recursive

      - name: Install Foundry
        uses: foundry-rs/foundry-toolchain@v1

      - name: Show Forge version
        run: forge --version

      - name: Run Forge fmt
        run: forge fmt --check

      - name: Run Forge build
        run: forge build --sizes

      - name: Run unit tests
        run: forge test -vvv --match-path "test/unit/*"

      # Forked tests need RPC endpoints. The `secrets` context is not available in a step-level
      # `if`, so the guard has to happen in the shell.
      - name: Run integration tests
        env:
          ETH_RPC: ${{ secrets.ETH_RPC }}
          RH_RPC: ${{ secrets.RH_RPC }}
        run: |
          if [ -z "$ETH_RPC" ] || [ -z "$RH_RPC" ]; then
            echo "::notice::RPC secrets not configured, skipping forked integration tests."
            exit 0
          fi
          forge test -vvv --match-path "test/integration/*"
